<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kassimNL — Stream Overlay</title>
<style>
:root{--accent:#78CBEA;--white:#fff;--ink:#050b12;--navy:#091724;--muted:#b9e8f7}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030910;font-family:Arial,Helvetica,sans-serif}
/* Vertical 1080 x 1920 branded stream frame */
#stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;transform-origin:top left;overflow:hidden;background:#050b12}
.outer{display:none}
.outer:before{content:"";position:absolute;inset:0;opacity:.18;background-image:repeating-linear-gradient(12deg,transparent 0 17px,rgba(255,255,255,.16) 18px,transparent 20px),repeating-linear-gradient(92deg,transparent 0 37px,rgba(120,203,234,.2) 38px,transparent 40px)}
.poster{position:absolute;left:34px;top:46px;width:1012px;height:1828px;transform:rotate(-.65deg);transform-origin:center;background:transparent;box-shadow:none;overflow:hidden;border:2px solid rgba(120,203,234,.8);border-radius:4px}
.top-panel{position:absolute;left:0;top:0;width:100%;height:35%;clip-path:polygon(0 0,100% 0,100% 94%,79% 100%,0 96%);background:radial-gradient(ellipse at 14% 28%,rgba(120,203,234,.5),transparent 42%),radial-gradient(ellipse at 84% 70%,rgba(120,203,234,.22),transparent 36%),linear-gradient(135deg,#102b3a,#03080e 72%);overflow:hidden}
.bottom-panel{position:absolute;bottom:0;left:0;width:100%;height:34%;clip-path:polygon(0 5%,34% 0,67% 3%,100% 0,100% 100%,0 100%);background:radial-gradient(ellipse at 10% 60%,rgba(120,203,234,.3),transparent 38%),radial-gradient(ellipse at 82% 44%,rgba(120,203,234,.26),transparent 44%),linear-gradient(150deg,#071522,#0a1b28 60%,#03080e);overflow:hidden}
/* Kleine, scherpe witte en lichtblauwe stipjes — geen rook of waas */
.particles{position:absolute;inset:0;opacity:.95;pointer-events:none;background-image:
 radial-gradient(circle, #fff 0 2px, transparent 3px),
 radial-gradient(circle, #78CBEA 0 2px, transparent 3.5px),
 radial-gradient(circle, #fff 0 1.5px, transparent 3px),
 radial-gradient(circle, #78CBEA 0 1.5px, transparent 3px),
 radial-gradient(circle, #fff 0 2.5px, transparent 4px),
 radial-gradient(circle, #78CBEA 0 2px, transparent 3.5px),
 radial-gradient(circle, #fff 0 1.5px, transparent 3px),
 radial-gradient(circle, #78CBEA 0 2px, transparent 3.5px),
 radial-gradient(circle, #fff 0 1.5px, transparent 3px),
 radial-gradient(circle, #78CBEA 0 2px, transparent 3.5px);
 background-size:137px 173px,191px 211px,223px 149px,167px 239px,251px 197px,181px 157px,149px 227px,239px 181px,203px 263px,271px 191px;
 background-position:12px 18px,72px 91px,44px 130px,101px 32px,190px 74px,22px 155px,133px 66px,176px 143px,81px 201px,214px 17px;
 animation:floatDots 18s linear infinite}
@keyframes floatDots{0%{background-position:12px 18px,72px 91px,44px 130px,101px 32px,190px 74px,22px 155px,133px 66px,176px 143px,81px 201px,214px 17px}100%{background-position:12px -155px,72px -120px,44px -43px,101px -207px,190px -123px,22px -2px,133px -161px,176px -38px,81px -62px,214px -174px}}
.logo-title{position:absolute;top:30%;left:3%;width:94%;text-align:center;transform:skewY(-3deg);font-family:Impact,"Arial Black",Montserrat,sans-serif;font-size:118px;line-height:1;letter-spacing:4px;font-weight:1000;text-transform:uppercase;color:#fff;background:linear-gradient(180deg,#fff 5%,#fff 38%,#b9e8f7 62%,#78CBEA 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.22);filter:drop-shadow(0 5px 0 #06131d) drop-shadow(0 0 12px rgba(120,203,234,.85)) drop-shadow(0 0 32px rgba(120,203,234,.42));z-index:2}
.logo-title:before{content:"kassimNL";position:absolute;inset:0;color:transparent;-webkit-text-stroke:2px rgba(120,203,234,.75);-webkit-text-fill-color:transparent;transform:translate(3px,4px);z-index:-1;filter:blur(.2px)}
@media(max-width:600px){.logo-title{font-size:112px}}
.top-mark{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);width:72px;height:100px;background:linear-gradient(90deg,#071522,#fff 35%,#102536 55%,#78CBEA 75%,#040a12);clip-path:polygon(25% 0,80% 0,100% 28%,70% 42%,85% 100%,30% 91%,0 36%);filter:drop-shadow(0 0 16px rgba(120,203,234,.8));z-index:3}
/* Open central zone for the stream/game scene */
.scene{position:absolute;top:35%;left:0;width:100%;height:31%;background:transparent;border:0;clip-path:none;pointer-events:none}
.socials{position:absolute;top:24%;bottom:auto;left:8%;width:84%;min-height:120px;display:flex;justify-content:center;align-items:center;gap:28px;padding:22px 24px;border:2px solid rgba(120,203,234,.9);border-radius:10px;background:#06111b;box-shadow:0 0 28px rgba(120,203,234,.2),inset 0 0 22px rgba(120,203,234,.08);transform:rotate(-.2deg)}
.social{display:flex;align-items:center;gap:14px;min-width:0}.social svg{width:52px;height:52px;flex:none;filter:drop-shadow(0 0 9px rgba(120,203,234,.6))}.social .label{font-size:15px;letter-spacing:3.5px;color:var(--accent);font-weight:900;margin-bottom:7px;text-shadow:0 0 12px rgba(120,203,234,.35)}.social .handle{font-size:31px;font-weight:900;color:#fff;letter-spacing:1px;text-shadow:0 2px 0 rgba(0,0,0,.5),0 0 12px rgba(120,203,234,.4)}.separator{height:64px;width:2px;background:linear-gradient(transparent,var(--accent),transparent);box-shadow:0 0 9px rgba(120,203,234,.7)}
.edge-glow{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 3px rgba(120,203,234,.48),inset 0 0 38px rgba(120,203,234,.12);animation:pulse 6s ease-in-out infinite}@keyframes pulse{50%{opacity:.58}}
#pause{position:fixed;z-index:10;top:8px;left:8px;opacity:0;padding:8px 12px;background:#071522;color:#fff;border:1px solid var(--accent);border-radius:8px;cursor:pointer}#pause:hover,#pause:focus-visible{opacity:1}
body.paused *{animation-play-state:paused!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<button id="pause" aria-pressed="false">Animaties pauzeren</button>
<div id="stage">
 <div class="outer"></div>
 <main class="poster">
  <section class="top-panel"><div class="particles"></div></section>
  <section class="scene" aria-label="Lege ruimte voor de livestream-scène"></section>
  <section class="bottom-panel"></section>
  <footer class="socials">
   <div class="social"><svg viewBox="0 0 24 24" aria-label="YouTube"><path fill="#78CBEA" d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8ZM9.5 15.6V8.4l6.3 3.6-6.3 3.6Z"/></svg><div><div class="label">YOUTUBE</div><div class="handle">KASSIMNL</div></div></div>
   <div class="separator"></div>
   <div class="social"><svg viewBox="0 0 24 24" aria-label="Twitch"><path fill="#ffffff" d="M4 2 1 5v16h5v3l3-3h4l7-7V2H4Zm14 11-4 4h-4l-3 3v-3H4V4h14v9Zm-7-6h2v5h-2V7Zm4 0h2v5h-2V7Z"/></svg><div><div class="label">TWITCH</div><div class="handle">KASSIMNL</div></div></div>
  </footer>
  <div class="edge-glow"></div>
 </main>
</div>
<script>
(()=>{const stage=document.getElementById('stage');function fit(){const s=Math.min(innerWidth/1080,innerHeight/1920);stage.style.transform=`scale(${s}) translate(-50%,-50%)`;stage.style.left='50%';stage.style.top='50%'}addEventListener('resize',fit);fit();const b=document.getElementById('pause');function toggle(){document.body.classList.toggle('paused');const p=document.body.classList.contains('paused');b.textContent=p?'Animaties hervatten':'Animaties pauzeren';b.setAttribute('aria-pressed',String(p))}b.addEventListener('click',toggle);addEventListener('keydown',e=>{if(e.key.toLowerCase()==='p')toggle()})})();
</script>
</body>
</html>
